name: Bug report
description: Report a reproducible problem in Command Relay
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach raw reports, private paths, credentials or proprietary scripts. For vulnerabilities use private security reporting.
  - type: input
    id: version
    attributes:
      label: Command Relay version
      placeholder: '4.1.0'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows, Python and PowerShell versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal fictional task; remove sensitive data.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reviewed and redacted evidence (optional)
